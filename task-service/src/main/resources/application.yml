server:
  port: ${PORT:8082}

spring:
  application:
    name: task-service
  datasource:
    # Local development: an H2 file database. Deployed: set DB_URL to a PostgreSQL JDBC URL, because free
    # hosts wipe the disk on every restart and H2 data would be lost (see README "Deployment").
    url: ${DB_URL:jdbc:h2:file:./data/taskdb}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  h2:
    console:
      # Handy locally; switched off in deployed environments (H2_CONSOLE_ENABLED=false).
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        # This service's own schema, created on startup. When both services share one PostgreSQL
        # database, each still owns separate tables that the other never touches. H2 uses PUBLIC.
        # Every table name is qualified with it; a per-connection search_path is not used, because
        # poolers such as Neon's PgBouncer don't keep one.
        default_schema: ${DB_SCHEMA:PUBLIC}
        hbm2ddl:
          create_namespaces: true
    open-in-view: false

app:
  jwt:
    # Must be byte-for-byte identical to user-service's app.jwt.secret (same JWT_SECRET env var),
    # otherwise every token user-service issues will fail signature verification here.
    # The fallback after ":" is a DEV-ONLY placeholder: it is public, so ALWAYS set JWT_SECRET outside local dev.
    secret: ${JWT_SECRET:dev-only-taskflow-jwt-secret-change-me-before-deploying-0123456789}
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:8081}
    connect-timeout: ${USER_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${USER_SERVICE_READ_TIMEOUT:3s}
