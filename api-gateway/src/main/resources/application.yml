server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/api/users/**
            - id: task-service
              uri: ${TASK_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/tasks/**
          # The browser only ever talks to the gateway, so CORS is handled here and nowhere else.
          # Preflight (OPTIONS) requests are answered by the gateway itself and never forwarded.
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
                allowed-methods: GET, POST, PUT, DELETE, OPTIONS
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600
          httpclient:
            # Fail fast when a downstream service is down or hung, instead of holding the request open.
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:10s}
